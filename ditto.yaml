# Behavior defaults by owner. Credentials and deployment bindings live in .env.
# 按配置归属分组；由 loadRuntimeConfigFile() 在启动时读取一次。

# Runtime / Graph orchestration (ReAct belongs here, not inside INFER).
runtime:
  timeoutMs: 120000
  maxTurns: 8
  react:
    maxActionCalls: 16
    maxTotalTokens: 64000

# Shared resources; names bind to DITTO_SHARED_PROVIDERS in .env.
shared:
  providers:
    deepseek:
      maxTokensField: max_tokens
      options:
        thinking:
          type: enabled
        reasoning_effort: low
    openai:
      maxTokensField: max_completion_tokens
    glm:
      maxTokensField: max_tokens
      options:
        thinking:
          type: enabled
    local:
      maxTokensField: max_tokens

# Worker-specific behavior; add sections only when a Worker consumes them.
workers:
  # Optional; this config does not register or start a RETRIEVAL Worker.
  retrieval:
    searchLimit: 10
  memory:
    queryLimit: 100
    searchLimit: 10
  infer:
    generation:
      maxTokens: 4096
    deliberate:
      mode: select
      selectCount: 1
      generation:
        maxTokens: 4096
    constraints:
      maxSteps: 16
      maxTotalTokens: 64000
    strategies:
      cot:
        rounds: 2
      long-cot:
        rounds: 4
      tot:
        breadth: 2
        depth: 2
        beamWidth: 2
      got:
        breadth: 2
        depth: 2
      self-consistency:
        candidates: 3
